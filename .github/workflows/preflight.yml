# Runs the same checks Vercel would, on every push, so a deployment that cannot
# land shows up here as a red cross instead of as a Production card quietly
# stuck on an older commit.
#
# Vercel refuses an invalid vercel.json before the build starts, which means no
# build logs and no failed-looking deployment — just a stale one. That is how
# three commits in a row went nowhere unnoticed. This job would have caught the
# first of them.
name: preflight

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # vercel.json must be something Vercel will accept
      - run: node tools/check-config.mjs

      # nothing the app says may be built by concatenation: such a string has
      # no literal to record and falls through to the device's own voice
      - run: node tools/check-voice.mjs

      # every stop, dealt 25 times, must produce rounds the app can draw —
      # a picture option for a word with no picture, or a sound in a word
      # breakdown with no clip behind it, is a blank square or a silence in
      # front of a child and neither throws
      - run: node tools/check-lessons.mjs --runs=25

      # every spoken line must have a clip, and dist/ must assemble —
      # this is the exact command Vercel runs
      - run: node tools/dist.mjs

      # the audio the page asks for must actually be in dist/
      - name: check the shipped audio
        run: |
          node -e '
            const { readFileSync, existsSync } = require("fs");
            const page = readFileSync("dist/index.html", "utf8");
            const win = {};
            new Function("window", readFileSync("dist/letter-clips.js", "utf8"))(win);
            new Function("window", readFileSync("dist/speech-clips.js", "utf8"))(win);
            const want = [];
            for (const k of Object.keys(win.LETTER_CLIPS)) {
              want.push("dist/audio/letters/" + k + ".mp3", "dist/audio/letters/" + k + "-slow.mp3");
            }
            for (const k of Object.keys(win.SPEECH_CLIPS)) {
              want.push("dist/audio/speech/" + win.SPEECH_CLIPS[k] + ".mp3");
            }
            const missing = want.filter((f) => !existsSync(f));
            if (missing.length) {
              console.error(missing.length + " audio files are referenced but not shipped:");
              missing.slice(0, 20).forEach((f) => console.error("  " + f));
              process.exit(1);
            }
            console.log(want.length + " audio files present");
            if (!/name="build"/.test(page)) { console.error("index.html has no build stamp"); process.exit(1); }
          '

      # the service worker must precache exactly what is in dist/, and every
      # script and clip must be asked for by the versioned URL it precaches —
      # without that a new deploy takes three reloads to reach an installed app
      - name: check the offline manifest
        run: |
          node -e '
            const { readFileSync, readdirSync, statSync } = require("fs");
            const sw = readFileSync("dist/sw.js", "utf8");
            const listed = new Set(JSON.parse(sw.match(/var ASSETS = (\[[\s\S]*?\]);/)[1])
              .map((u) => u.split("?")[0]));
            const walk = (d, base) => readdirSync(d).flatMap((f) => {
              const p = d + "/" + f;
              return statSync(p).isDirectory() ? walk(p, base + f + "/") : [base + f];
            });
            const onDisk = walk("dist", "").filter((f) => f !== "sw.js");
            const missing = onDisk.filter((f) => !listed.has("./" + f));
            if (missing.length) {
              console.error(missing.length + " files ship but are not precached:");
              missing.slice(0, 20).forEach((f) => console.error("  " + f));
              process.exit(1);
            }
            console.log(onDisk.length + " files shipped, all precached");
            const page = readFileSync("dist/index.html", "utf8");
            const v = (page.match(/window\.ASSET_V = .([0-9a-f]+)./) || [])[1];
            if (!v) { console.error("index.html carries no ASSET_V"); process.exit(1); }
            const unstamped = JSON.parse(sw.match(/var ASSETS = (\[[\s\S]*?\]);/)[1])
              .filter((u) => /\.(js|mp3)$/.test(u));
            if (unstamped.length) {
              console.error(unstamped.length + " asset(s) precached without ?v=, so a deploy would not reach an installed app:");
              unstamped.slice(0, 10).forEach((u) => console.error("  " + u));
              process.exit(1);
            }
            if (!page.includes("app.js?v=" + v)) { console.error("index.html does not load app.js with the version stamp"); process.exit(1); }
            console.log("assets stamped with version " + v);
          '
