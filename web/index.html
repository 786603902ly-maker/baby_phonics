<style>
/* ==========================================================================
   Phonics Trail
   Three typefaces, each with a job:
     Fredoka — display, rounded, friendly
     Nunito  — grown-up interface text
     Andika  — every letter the CHILD reads. Designed by SIL for literacy
               learners: single-storey a and g, unambiguous l / I / 1.
               A teaching decision, not a styling one.
   The first letter of every keyword is red, the way the paper cards do it.
   ========================================================================== */

:root {
  --ground:   #FFF6E9;
  --surface:  #FFFFFF;
  --surface2: #F7EEE0;
  --ink:      #2E2A3B;
  --ink2:     #6E6580;
  --line:     #E7DAC7;
  --otter:    #C77B3E;
  --river:    #2D8FA8;
  --sun:      #F5C518;
  --leaf:     #5AA469;
  --coral:    #E8624A;
  --plate:    #FFFCF5;
  --shadow:   0 3px 0 rgba(46,42,59,.10), 0 12px 26px -16px rgba(46,42,59,.45);
  --lift:     0 5px 0 rgba(46,42,59,.14), 0 20px 36px -18px rgba(46,42,59,.5);
  --r:  18px;
  --r2: 26px;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --ui: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --letter: 'Andika', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #17151F; --surface: #221F2E; --surface2: #2B2739;
    --ink: #F4EEE3; --ink2: #A79EB7; --line: #38334C;
    --otter: #E09A5E; --river: #4FB6D0; --sun: #F5C518; --leaf: #7CC78D; --coral: #FF8267;
    --shadow: 0 3px 0 rgba(0,0,0,.35), 0 12px 26px -16px rgba(0,0,0,.8);
    --lift:   0 5px 0 rgba(0,0,0,.4), 0 20px 36px -18px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"] {
  --ground: #17151F; --surface: #221F2E; --surface2: #2B2739;
  --ink: #F4EEE3; --ink2: #A79EB7; --line: #38334C;
  --otter: #E09A5E; --river: #4FB6D0; --sun: #F5C518; --leaf: #7CC78D; --coral: #FF8267;
  --shadow: 0 3px 0 rgba(0,0,0,.35), 0 12px 26px -16px rgba(0,0,0,.8);
  --lift:   0 5px 0 rgba(0,0,0,.4), 0 20px 36px -18px rgba(0,0,0,.85);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--ui); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, select:focus-visible, input:focus-visible, label:focus-visible {
  outline: 3px solid var(--river); outline-offset: 3px; border-radius: 10px;
}
svg { display: block; width: 100%; height: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }

.screen { max-width: 820px; margin: 0 auto; padding-inline: 18px; padding-block: 16px 44px; }

/* ===================== WELCOME ===================== */
.wrap-welcome { position: relative; min-height: 82vh; display: grid; place-items: center; }
.welcome { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wphoto {
  width: clamp(150px, 42vw, 190px); aspect-ratio: 1; padding: 14px;
  border-radius: 50%; background: var(--surface2) center/cover no-repeat;
  border: 6px solid var(--sun); box-shadow: var(--lift);
}
.wphoto.has-photo { padding: 0; }
.weyebrow { margin: 16px 0 0; font-size: 11.5px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--ink2); }
.wname { font-size: clamp(32px, 10vw, 46px); line-height: 1.05; }
.wstars { display: flex; align-items: center; gap: 7px; margin-top: 4px; color: var(--ink2); font-weight: 700; }
.wstar { width: 22px; height: 22px; }
.wstars b { font-family: var(--display); font-size: 26px; color: var(--ink); }
.wstars small { font-size: 13px; }

.bigbtn {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-top: 22px; padding: 18px 46px;
  background: var(--otter); color: #FFF9F0; border-radius: 999px;
  font-family: var(--display); font-size: 26px; font-weight: 600;
  box-shadow: var(--lift);
}
.bigbtn:active { transform: translateY(3px); box-shadow: var(--shadow); }
.bigbtn-glyph { width: 26px; height: 26px; flex: none; }
.bigbtn--sm { margin-top: 0; padding: 13px 30px; font-size: 19px; }
.bigbtn--sm .bigbtn-glyph { width: 18px; height: 18px; }
.today {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  width: min(100%, 340px); margin-top: 20px; padding: 14px 20px 18px;
  background: var(--otter); color: #FFF9F0;
  border-radius: var(--r2); box-shadow: var(--lift);
}
.today:active { transform: translateY(3px); box-shadow: var(--shadow); }
.today-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.today-row { display: flex; align-items: center; gap: 14px; }
.today-letter { font-family: var(--letter); font-size: 46px; font-weight: 700; line-height: 1; }
.today-pic { width: 52px; height: 52px; flex: none; padding: 5px; background: var(--plate); border-radius: 13px; }
.today-word { font-family: var(--letter); font-size: 21px; font-weight: 700; }
.today.is-done { background: var(--surface2); color: var(--ink); box-shadow: var(--shadow); border: 2px solid var(--line); }
.today.is-done .today-eyebrow { color: var(--leaf); opacity: 1; }

.week { display: flex; gap: 7px; margin-top: 22px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wk i {
  display: grid; place-items: center; width: 26px; height: 26px; padding: 4px;
  background: var(--surface2); border: 2px solid var(--line); border-radius: 50%;
}
.wk.on i { background: color-mix(in srgb, var(--sun) 22%, var(--surface)); border-color: var(--sun); }
.wk.now i { border-width: 3px; border-color: var(--otter); }
.wk b { font-size: 10px; font-weight: 800; color: var(--ink2); }

.wrow { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
.wrow .ghostbtn { margin-top: 0; }
.ghostbtn--game { display: flex; align-items: center; gap: 8px; color: var(--ink); border-color: var(--sun); }
.gb-glyph { width: 19px; height: 19px; }
.ghostbtn {
  margin-top: 12px; padding: 11px 26px; border-radius: 999px;
  background: var(--surface2); border: 2px solid var(--line);
  font-weight: 800; font-size: 14.5px; color: var(--ink2);
}

.gear {
  position: absolute; top: 0; right: 0;
  width: 40px; height: 40px; padding: 10px; color: var(--ink2);
  background: var(--surface2); border: 2px solid var(--line); border-radius: 50%;
  transition: transform .25s, color .25s;
}
.gear.holding { transform: rotate(180deg) scale(1.12); color: var(--river); }

/* ===================== SHARED HEAD ===================== */
.mhead { display: flex; align-items: center; gap: 12px; }
.mtitle { flex: 1; text-align: center; font-size: 19px; }
.iconbtn {
  width: 48px; height: 48px; flex: none; padding: 13px;
  background: var(--surface); border: 2px solid var(--line);
  border-radius: 50%; color: var(--ink2);
}
.iconbtn--ghost { visibility: hidden; }
.mstars { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
.ms-glyph { width: 22px; height: 22px; }
.mstars b { font-family: var(--display); font-size: 22px; }

/* ===================== MAP ===================== */
.lvtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.lvtab {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-align: left;
  background: var(--surface2); border: 2px solid transparent; border-radius: var(--r);
}
.lvtab.is-on { background: var(--surface); border-color: var(--ink); box-shadow: var(--shadow); }
.lvtab.is-soon { opacity: .55; }
.lvtab-n {
  width: 34px; height: 34px; flex: none; border-radius: 11px; padding: 0;
  display: grid; place-items: center; color: #FFF9F0;
  font-family: var(--display); font-size: 17px;
}
.lvtab-n svg { width: 16px; height: 16px; }
.lvtab-t b { display: block; font-size: 14px; line-height: 1.2; }
.lvtab-t small { font-size: 11.5px; color: var(--ink2); font-weight: 700; }
.tint-leaf { background: var(--leaf); } .tint-river { background: var(--river); }
.tint-otter { background: var(--otter); } .tint-sun { background: var(--sun); color: #4A3B00; }

.lvblurb { margin: 14px 0 4px; text-align: center; font-size: 14.5px; color: var(--ink2); }

.gamecard {
  display: flex; align-items: center; gap: 14px; width: 100%;
  margin-top: 10px; padding: 13px 18px; text-align: left;
  background: color-mix(in srgb, var(--sun) 15%, var(--surface));
  border: 3px solid var(--sun); border-radius: var(--r2); box-shadow: var(--shadow);
}
.gamecard:active { transform: translateY(2px); }
.gamecard-icon { width: 46px; height: 46px; flex: none; }
.gamecard-text { flex: 1; min-width: 0; }
.gamecard-text b { display: block; font-family: var(--display); font-size: 19px; font-weight: 600; }
.gamecard-text small { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.gamecard-stars { display: flex; gap: 3px; flex: none; }

.path { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 14px 0; }
.path::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
  border-left: 6px dotted var(--line); transform: translateX(-50%);
}
.stop {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 13px;
  width: min(100%, 330px); padding: 9px 18px 9px 9px;
  background: var(--surface); border: 3px solid var(--line);
  border-radius: 999px; box-shadow: var(--shadow); text-align: left;
}
.stop.left { align-self: flex-start; }
.stop.right { align-self: flex-end; flex-direction: row-reverse; text-align: right; padding: 9px 9px 9px 18px; }
.stop:active { transform: translateY(2px); }
.stop-pic { width: 60px; height: 60px; flex: none; padding: 8px; background: var(--plate); border-radius: 50%; }
.stop-body { flex: 1; min-width: 0; }
.stop-body b { display: block; font-family: var(--display); font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stop-stars { display: flex; gap: 3px; margin-top: 2px; }
.stop.right .stop-stars { justify-content: flex-end; }
.st { display: block; width: 15px; height: 15px; color: var(--line); }
.stop.is-done { border-color: var(--leaf); }
.stop.is-done .stop-pic { box-shadow: 0 0 0 3px var(--leaf); }
.stop.is-next { border-color: var(--otter); box-shadow: var(--lift); }
.stop.is-next .stop-pic { box-shadow: 0 0 0 3px var(--otter); }

.soon { text-align: center; padding: 46px 20px; }
.soon-badge { width: 56px; height: 56px; margin: 0 auto 14px; padding: 14px; color: var(--ink2); background: var(--surface2); border-radius: 50%; }
.soon h2 { font-size: 23px; }
.soon p { margin: 8px 0 0; color: var(--ink2); font-size: 14.5px; }
.soon-age { font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 11.5px !important; }

/* ===================== MY BOOK ===================== */
.bigstars { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 22px 0 6px; }
.bigstar { width: 44px; height: 44px; }
.bigstars b { font-family: var(--display); font-size: 40px; }
.bigstars small { color: var(--ink2); font-weight: 700; }
.bsec { margin: 26px 0 10px; font-size: 17px; }
.bletters { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.bl {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: var(--surface2); border: 2px solid var(--line); border-radius: var(--r);
  color: var(--ink2);
}
.bl b { font-family: var(--letter); font-size: 26px; }
.bl span { display: flex; gap: 1px; height: 11px; }
.bl .st { width: 11px; height: 11px; }
.bl.got { background: var(--surface); border-color: var(--leaf); color: var(--ink); box-shadow: var(--shadow); }
.bthemes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bt {
  display: flex; align-items: center; gap: 9px; padding: 9px 12px;
  background: var(--surface2); border: 2px solid var(--line); border-radius: var(--r);
  font-size: 13.5px; font-weight: 700; color: var(--ink2);
}
.bt svg { width: 30px; height: 30px; flex: none; background: var(--plate); border-radius: 8px; padding: 3px; }
.bt span { flex: 1; }
.bt .st { width: 12px; height: 12px; }
.bt.got { background: var(--surface); border-color: var(--leaf); color: var(--ink); }

/* ===================== PLAY ===================== */
.screen-play { display: flex; flex-direction: column; min-height: 86vh; }
.pbar-row { display: flex; align-items: center; gap: 10px; }
.pbar { flex: 1; height: 12px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; transition: width .35s ease; }
.scorechip {
  display: flex; align-items: center; gap: 5px; padding: 5px 12px;
  background: var(--surface2); border-radius: 999px;
}
.sc-glyph { width: 16px; height: 16px; }
.scorechip b { font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }

.says {
  display: flex; align-items: center; gap: 12px;
  margin: 16px 0 20px; padding: 13px 18px;
  background: var(--surface); border: 3px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--shadow);
}
.says-pip { width: 42px; height: 42px; flex: none; }
.says p { margin: 0; font-family: var(--display); font-size: clamp(17px, 4.6vw, 22px); font-weight: 500; }
.says .gl { font-family: var(--letter); font-weight: 700; color: var(--coral); }
.says em { font-style: normal; text-decoration: underline; text-decoration-color: var(--otter); text-decoration-thickness: 3px; text-underline-offset: 3px; }

.stagearea { flex: 1; display: flex; flex-direction: column; justify-content: center; }

.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 560px; margin-inline: auto; }
.opt {
  aspect-ratio: 1; display: grid; grid-template-rows: 1fr auto;
  align-items: center; justify-items: center; gap: 5px; padding: 12px 9px;
  background: var(--surface); border: 4px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--shadow);
  transition: transform .12s, border-color .15s;
}
.opt:active { transform: scale(.95); }
.opt--pic { aspect-ratio: 4 / 5; }
.opt .pic { display: block; width: 100%; max-width: 96px; aspect-ratio: 1; }
.pic { display: block; background: var(--plate); border-radius: 14px; padding: 5px; }
.pic--photo { padding: 0; }
.pic--photo { background-size: cover; background-position: center; border-radius: 12px; }
.picword {
  font-family: var(--letter); font-weight: 700; line-height: 1.1; text-align: center;
  font-size: clamp(13px, 3.6vw, 18px); word-break: break-word;
}
.opt .glyph { font-family: var(--letter); font-size: clamp(40px, 13vw, 62px); font-weight: 700; line-height: 1; }
.opt.is-right { border-color: var(--leaf); background: color-mix(in srgb, var(--leaf) 15%, var(--surface)); animation: pop .45s ease; }
.opt.is-wrong { border-color: var(--coral); animation: wob .4s ease; }
.opts-row { max-width: 420px; }
.opts-row .opt { aspect-ratio: 4/3; }

@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes wob { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes glow { 0%,100% { box-shadow: var(--lift); } 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--leaf) 26%, transparent); } }
.bump { animation: pop .4s ease; }

/* ---- the letter card ---- */
.card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.card-top {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 12px 44px; background: var(--otter); color: #FFF9F0;
  border-radius: var(--r2); box-shadow: var(--lift);
}
.card-head { display: flex; align-items: stretch; justify-content: center; gap: 12px; flex-wrap: wrap; }
.card-letter { font-family: var(--letter); font-size: clamp(48px, 13vw, 74px); line-height: 1.02; font-weight: 700; }
.card-ipa {
  font-family: var(--ui); font-size: 16px; font-weight: 800; letter-spacing: .02em;
  background: rgba(255, 249, 240, .24); padding: 1px 12px; border-radius: 999px; margin-top: 3px;
}
.card-mouth {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: 152px; padding: 10px 10px 12px;
  background: var(--surface); border: 3px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--shadow);
}
.card-mouth svg { width: 74px; height: 74px; }
.card-tip { font-size: 11.5px; font-weight: 700; line-height: 1.3; color: var(--ink2); text-align: center; }
.card-also {
  margin: 0; max-width: 46ch; text-align: center;
  font-size: 12.5px; font-weight: 700; color: var(--ink2);
  background: var(--surface2); padding: 7px 16px; border-radius: 999px;
}
.card-friend { font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.kws { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 500px; }
.kw {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 10px;
  background: var(--surface); border: 3px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--shadow);
}
.kw-pic { width: 100%; max-width: 86px; aspect-ratio: 1; background: var(--plate); border-radius: 14px; padding: 5px; }
.kw-text { font-family: var(--letter); font-size: clamp(17px, 5vw, 23px); font-weight: 700; }
.kw-text b { color: var(--coral); }
.kw.seen { border-color: var(--leaf); }
.nextbtn {
  width: 74px; height: 74px; padding: 23px; border-radius: 50%;
  background: var(--line); color: var(--surface2); transition: background .25s, color .25s;
}
.nextbtn.ready { background: var(--leaf); color: #FFF9F0; box-shadow: var(--lift); animation: glow 2s ease-in-out infinite; }

/* ---- hidden letter ---- */
.missing { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.missing-pic { width: clamp(110px, 32vw, 150px); height: clamp(110px, 32vw, 150px); background: var(--plate); border-radius: 20px; padding: 8px; }
.missing-word {
  display: flex; align-items: center; gap: 4px;
  font-family: var(--letter); font-size: clamp(34px, 10vw, 50px); font-weight: 700;
}
.missing-word .ch { display: inline-block; }
.slot {
  display: inline-grid; place-items: center; min-width: 1em; padding: 0 .12em;
  color: var(--otter); border-bottom: 7px solid var(--otter);
}
.slot.filled { color: var(--leaf); border-color: var(--leaf); animation: pop .5s ease; }

/* ---- memory pairs ---- */
.memory { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 470px; margin-inline: auto; }
.mcard {
  position: relative; aspect-ratio: 1; overflow: hidden;
  background: var(--surface); border: 4px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--shadow);
}
.mback { position: absolute; inset: 20%; transition: opacity .25s; }
.mface {
  position: absolute; inset: 8%; transition: opacity .25s;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.mface .pic { width: 100%; max-width: 66px; aspect-ratio: 1; }
.mface .picword { font-size: clamp(11px, 3vw, 14px); }
.mback { color: var(--sun); }
.mface { opacity: 0; }
.mcard.up, .mcard.matched { border-color: var(--river); }
.mcard.up .mface, .mcard.matched .mface { opacity: 1; }
.mcard.up .mback, .mcard.matched .mback { opacity: 0; }
.mcard.matched { border-color: var(--leaf); background: color-mix(in srgb, var(--leaf) 14%, var(--surface)); }

/* ---- level 3: sound it out ---- */
.blend { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.btiles { display: flex; gap: 10px; transition: gap .5s ease; flex-wrap: wrap; justify-content: center; }
.btiles.squeeze { gap: 1px; }
.btile {
  min-width: 68px; height: 88px; padding: 0 10px;
  display: grid; place-items: center;
  background: var(--surface); border: 3px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  font-family: var(--letter); font-size: clamp(30px, 9vw, 42px); font-weight: 700;
}
.btile.lit { border-color: var(--otter); background: color-mix(in srgb, var(--otter) 16%, var(--surface)); animation: pop .35s ease; }
.pushbtn {
  display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px;
  background: var(--river); color: #FFF9F0; font-weight: 800; font-size: 14px; box-shadow: var(--shadow);
}
.pushbtn svg { width: 42px; height: 18px; }
.pushbtn:disabled { background: var(--surface2); color: var(--ink2); box-shadow: none; cursor: default; }
.reveal { animation: pop .5s ease; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.reveal .pic { width: 108px; height: 108px; }
.reveal .picword { font-size: 26px; }

/* ---- level 3: build the word ---- */
.builder { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.builder-pic .pic { width: clamp(96px, 26vw, 124px); height: clamp(96px, 26vw, 124px); }
.slots { display: flex; gap: 9px; }
.slot {
  min-width: 62px; height: 78px; padding: 0 8px;
  background: var(--surface2); border: 3px dashed var(--line); border-radius: var(--r);
  display: grid; place-items: center;
  font-family: var(--letter); font-size: clamp(26px, 8vw, 36px); font-weight: 700;
}
.slot.filled { border-style: solid; border-color: var(--leaf); background: var(--surface); animation: pop .35s ease; }
.ltiles { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
.ltile {
  min-width: 60px; height: 74px; padding: 0 10px;
  display: grid; place-items: center;
  background: var(--surface); border: 3px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  font-family: var(--letter); font-size: clamp(26px, 8vw, 36px); font-weight: 700;
}
.ltile.used { opacity: .25; box-shadow: none; }
.ltile.is-wrong { border-color: var(--coral); animation: wob .4s ease; }

/* ---- level 3: magic e ---- */
.magice { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.magice-pic .pic { width: clamp(110px, 30vw, 150px); height: clamp(110px, 30vw, 150px); }
.magice-word {
  font-family: var(--letter); font-size: clamp(42px, 13vw, 62px); font-weight: 700;
  padding: 8px 26px; background: var(--surface); border: 3px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--shadow);
}
.magice-word b { color: var(--coral); }

/* ---- level 3: read the word ---- */
.bigword {
  font-family: var(--letter); font-size: clamp(44px, 14vw, 70px); font-weight: 700;
  text-align: center; margin-bottom: 18px;
}
.anchor { display: flex; justify-content: center; margin-bottom: 16px; }
.anchor svg, .anchor .pic { width: clamp(96px, 26vw, 130px); height: clamp(96px, 26vw, 130px); }
.anchor .pic { background: var(--plate); border-radius: 16px; padding: 6px; }

/* ---- level 4: sentences ---- */
.sent { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.sent-pic .pic { width: clamp(84px, 22vw, 110px); height: clamp(84px, 22vw, 110px); }
.sent-line {
  min-height: 60px; width: 100%; max-width: 520px;
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
  padding: 10px 12px; background: var(--surface2);
  border: 3px dashed var(--line); border-radius: var(--r2);
}
.placed-word {
  font-family: var(--letter); font-size: clamp(19px, 5.4vw, 26px); font-weight: 700;
  animation: pop .35s ease;
}
.sent-bank { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
.wcard {
  padding: 10px 16px; border-radius: var(--r);
  background: var(--surface); border: 3px solid var(--line); box-shadow: var(--shadow);
  font-family: var(--letter); font-size: clamp(18px, 5vw, 24px); font-weight: 700;
}
.wcard.used { opacity: .25; box-shadow: none; }
.wcard.is-wrong { border-color: var(--coral); animation: wob .4s ease; }

/* ---- level 4: a page of a story ---- */
.story { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.story-title { margin: 0; font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.story-pic .pic { width: clamp(120px, 34vw, 168px); height: clamp(120px, 34vw, 168px); }
.story-text {
  margin: 0; max-width: 520px; text-align: center;
  display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: center;
}
.sword {
  font-family: var(--letter); font-size: clamp(21px, 6vw, 30px); font-weight: 700;
  padding: 2px 4px; border-radius: 8px;
}
.sword.lit { background: color-mix(in srgb, var(--sun) 40%, transparent); animation: pop .3s ease; }

/* ===================== GAMES HUB ===================== */
.gtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
.gtile {
  display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 14px 10px 12px;
  background: var(--surface); border: 3px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--shadow); text-align: center;
}
.gtile:active { transform: translateY(2px); }
.gtile-pic { width: 52px; height: 52px; padding: 5px; background: var(--plate); border-radius: 14px; }
.gtile b { font-family: var(--display); font-size: 15.5px; font-weight: 600; line-height: 1.15; }
.gtile small { font-size: 10.5px; font-weight: 700; color: var(--ink2); }
.gtile-stars { display: flex; gap: 2px; margin-top: 2px; }
.gtile-stars .st { width: 13px; height: 13px; }

/* ===================== END OF STOP ===================== */
.screen-done { display: grid; place-items: center; min-height: 76vh; }
.donecard {
  text-align: center; padding: 32px 26px; max-width: 420px;
  background: var(--surface); border: 3px solid var(--line);
  border-radius: var(--r2); box-shadow: var(--lift);
}
.donestars { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
.donestars .st { width: 54px; height: 54px; animation: pop .6s ease backwards; }
.donestars .st:nth-child(2) { animation-delay: .14s; }
.donestars .st:nth-child(3) { animation-delay: .28s; }
.donecard h1 { font-size: 25px; }
.donescore { margin: 8px 0 0; font-size: 17px; color: var(--ink2); }
.donescore b { font-family: var(--display); font-size: 24px; color: var(--leaf); }
.donetotal { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 6px 0 0; font-size: 13.5px; color: var(--ink2); font-weight: 700; }
.dt-glyph { width: 16px; height: 16px; }
.donebtns { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.donecap { margin: 16px 0 0; font-size: 13px; color: var(--ink2); }

/* ===================== GROWN-UPS =====================
   Deliberately a different register from the child's side: denser,
   tabular, square corners. The contrast is the signal. */
.screen-parent { font-size: 14.5px; }
.phead { display: flex; align-items: center; gap: 12px; }
.phead h2 { flex: 1; text-align: center; font-size: 19px; }
.tabs { display: flex; gap: 6px; margin-top: 18px; border-bottom: 2px solid var(--line); }
.tab { padding: 9px 16px; font-weight: 800; font-size: 13px; color: var(--ink2); text-transform: capitalize; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab.is-on { color: var(--ink); border-bottom-color: var(--river); }

.panel { margin-top: 16px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.panel h3 { font-family: var(--ui); font-size: 15px; font-weight: 800; }
.panel h3 small { font-weight: 700; color: var(--ink2); font-size: 12.5px; margin-left: 6px; }
.panel h4 { margin: 16px 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.panel--danger { border-color: color-mix(in srgb, var(--coral) 45%, var(--line)); }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--ink2); max-width: 66ch; }
.warn { color: var(--coral); font-weight: 700; }
.stat { margin: 10px 0 0; font-size: 13px; color: var(--ink2); }
.stat b { font-size: 20px; color: var(--ink); font-family: var(--display); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.kpi small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.kpi b { font-family: var(--display); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi b i { font-size: 15px; font-style: normal; color: var(--ink2); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
.grid--wide { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.cell {
  aspect-ratio: 1; display: grid; place-items: center; border-radius: 7px;
  font-family: var(--letter); font-size: 15px; font-weight: 700;
  background: var(--surface2); color: var(--ink2); border: 1px solid var(--line);
}
.grid--wide .cell { aspect-ratio: auto; padding: 7px 5px; font-family: var(--ui); font-size: 11.5px; text-align: center; }
.cell.b1 { background: color-mix(in srgb, var(--coral) 22%, var(--surface2)); color: var(--ink); }
.cell.b2 { background: color-mix(in srgb, var(--sun) 32%, var(--surface2)); color: var(--ink); }
.cell.b3 { background: color-mix(in srgb, var(--sun) 55%, var(--surface2)); color: var(--ink); }
.cell.b4 { background: color-mix(in srgb, var(--leaf) 42%, var(--surface2)); color: var(--ink); }
.cell.b5 { background: var(--leaf); color: #FFF9F0; border-color: var(--leaf); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 11.5px; color: var(--ink2); }
.lg { display: flex; align-items: center; gap: 5px; }
.lg .cell { width: 15px; height: 15px; aspect-ratio: auto; }

.weak { margin: 10px 0 0; padding-left: 20px; }
.weak li { margin-bottom: 8px; }
.weak b { font-family: var(--letter); font-size: 17px; }
.weak .acc { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--coral) 18%, var(--surface2)); font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
.weak em { display: block; font-style: normal; font-size: 12.5px; color: var(--ink2); }

.tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.tbl th { text-align: left; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }

.field { display: block; margin-top: 12px; }
.field > span { display: block; font-size: 12px; font-weight: 800; color: var(--ink2); margin-bottom: 5px; }
.field--row { display: flex; align-items: center; justify-content: space-between; }
.field--row > span { margin: 0; }
select, input[type=range], input[type=text] { width: 100%; max-width: 340px; }
select, input[type=text] {
  padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface2); color: var(--ink); font: inherit; font-size: 13.5px;
}
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--river); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-block; padding: 10px 18px; border-radius: 999px;
  background: var(--otter); color: #FFF9F0; font-weight: 800; font-size: 13.5px; cursor: pointer;
}
.btn--ghost { background: var(--surface2); color: var(--ink); border: 2px solid var(--line); }
.btn--danger { background: var(--coral); color: #FFF9F0; }

.photorow { display: flex; align-items: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
.pphoto {
  width: 80px; height: 80px; flex: none; padding: 20px; border-radius: 50%;
  background: var(--surface2) center/cover no-repeat; color: var(--ink2);
  border: 3px solid var(--line);
}
.pphoto.has-photo { padding: 0; border-color: var(--sun); }

.piclist { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
.picrow {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  border: 1px solid var(--line); border-radius: 10px;
}
.picthumb {
  width: 42px; height: 42px; flex: none; padding: 5px; border-radius: 9px;
  background: var(--plate) center/cover no-repeat;
}
.picthumb.has { padding: 0; border: 2px solid var(--leaf); }
.piclabel { flex: 1; min-width: 0; font-family: var(--letter); font-size: 15px; font-weight: 700; }
.piclabel em { display: block; font-family: var(--ui); font-style: normal; font-size: 10.5px; font-weight: 600; color: var(--ink2); }
.picdel { font-size: 20px; }

.vlist { margin-top: 10px; border-top: 1px solid var(--line); }
.vrow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.vlabel { flex: 1; font-family: var(--letter); font-size: 16px; font-weight: 700; }
.vlabel em { display: block; font-family: var(--ui); font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--ink2); }
.vbtn {
  width: 38px; height: 38px; flex: none; padding: 10px;
  border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface2); color: var(--ink2);
  display: grid; place-items: center; font-size: 18px;
}
.vrow.has .vlabel { color: var(--leaf); }
.vrow.has .vplay { color: var(--leaf); border-color: var(--leaf); }
.vrow.recording .vrec { background: var(--coral); color: #fff; border-color: var(--coral); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .5; } }

/* ===================== TOAST ===================== */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 14px);
  padding: 11px 18px; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--ground);
  border-radius: 999px; font-size: 13.5px; font-weight: 700;
  opacity: 0; transition: opacity .2s, transform .2s; z-index: 60; box-shadow: var(--lift);
}
.toast.go { opacity: 1; transform: translate(-50%, 0); }

/* ===================== NARROW ===================== */
@media (max-width: 430px) {
  .screen { padding-inline: 14px; }
  .lvtabs { grid-template-columns: 1fr; }
  .today { padding: 12px 14px 16px; }
  .today-letter { font-size: 40px; }
  .wrow .ghostbtn { padding: 10px 16px; font-size: 13.5px; }
  .stop { width: 100%; }
  .kws { gap: 9px; }
  .kw { padding: 9px 7px; }
  .opts { gap: 9px; }
  .opt { padding: 8px 6px; border-width: 3px; }
  .card-mouth { width: 132px; }
  .card-mouth svg { width: 62px; height: 62px; }
  .memory { gap: 9px; }
  .bletters { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
